name: Codex integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - run: python3 scripts/codex/studio.py check
      - run: python3 -m unittest discover -s tests/codex -v
